<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minkowski Shader Image Processor</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: monospace; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui {
            position: absolute; top: 10px; left: 10px; padding: 15px;
            background: rgba(0,0,0,0.8); border: 1px solid #444; border-radius: 4px;
            display: flex; flex-direction: column; gap: 10px; width: 220px;
        }
        label { font-size: 11px; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; }
        input[type="file"] { font-size: 11px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
    <label>Load Custom Image:</label>
    <input type="file" id="file-input" accept="image/*">
    <hr style="border:0; border-top:1px solid #444; width:100%;">
    
    <label>Scale <span id="val-scale">10.0</span></label>
    <input type="range" id="scale" min="1" max="50" value="10" step="0.1">
    
    <label>Warp Intensity <span id="val-warp">0.5</span></label>
    <input type="range" id="warp" min="0" max="2" value="0.5" step="0.01">

    <label>Cycle Speed <span id="val-speed">1.0</span></label>
    <input type="range" id="speed" min="0" max="5" value="1.0" step="0.1">

    <label>Color Mix <span id="val-mix">0.5</span></label>
    <input type="range" id="mix" min="0" max="1" value="0.5" step="0.01">
</div>

<div id="canvas-container"></div>

<script>
const fragmentShader = `
    uniform sampler2D u_texture;
    uniform vec2 u_resolution;
    uniform float u_time;
    uniform float u_scale;
    uniform float u_warp;
    uniform float u_mix;

    varying vec2 vUv;

    void main() {
        // Center coordinates (-1.0 to 1.0) adjusting for aspect ratio
        vec2 st = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
        
        // Scale space
        st *= u_scale;

        // Minkowski pseudo-metric: x^2 - y^2
        float minkowski = st.x * st.x - st.y * st.y;

        // Compute hyperbolic distance field with time offset
        float field = sin(minkowski * u_warp - u_time);

        // Distort UV texture coordinates along the hyperbolic field
        vec2 distortedUv = vUv + vec2(cos(field), sin(field)) * (u_warp * 0.1);

        // Fetch original texture color with distorted UVs
        vec4 texColor = texture2D(u_texture, fract(distortedUv));

        // Generate synthetic color cycling bands
        vec3 cycleColor = 0.5 + 0.5 * cos(u_time + field + vec3(0.0, 2.0, 4.0));

        // Blend raw image with the Minkowski metric field
        vec3 finalColor = mix(texColor.rgb, texColor.rgb * cycleColor, u_mix);

        gl_FragColor = vec4(finalColor, 1.0);
    }
`;

const vertexShader = `
    varying vec2 vUv;
    void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
    }
`;

// Initialize Scene
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

// Generate default procedural texture
const canvas = document.createElement('canvas');
canvas.width = canvas.height = 256;
const ctx = canvas.getContext('2d');
for (let x=0; x<256; x++) {
    for (let y=0; y<256; y++) {
        ctx.fillStyle = `rgb(${x},${y},${(x+y)%255})`;
        ctx.fillRect(x, y, 1, 1);
    }
}
let texture = new THREE.CanvasTexture(canvas);

// Uniforms
const uniforms = {
    u_texture: { value: texture },
    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    u_time: { value: 0 },
    u_scale: { value: 10.0 },
    u_warp: { value: 0.5 },
    u_mix: { value: 0.5 }
};

const material = new THREE.ShaderMaterial({ vertexShader, fragmentShader, uniforms });
const geometry = new THREE.PlaneGeometry(2, 2);
scene.add(new THREE.Mesh(geometry, material));

// UI Binding
let speed = 1.0;
const bindInput = (id, targetUniform, targetVal) => {
    document.getElementById(id).addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        if (targetUniform) uniforms[targetUniform].value = val;
        if (targetVal) speed = val;
        document.getElementById(`val-${id}`).innerText = val.toFixed(1);
    });
};

bindInput('scale', 'u_scale');
bindInput('warp', 'u_warp');
bindInput('speed', null, true);
bindInput('mix', 'u_mix');

// Image Upload Handling
document.getElementById('file-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            new THREE.TextureLoader().load(event.target.result, (newTex) => {
                uniforms.u_texture.value = newTex;
            });
        };
        reader.readAsDataURL(file);
    }
});

// Window Resize
window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
});

// Render Loop
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    uniforms.u_time.value += clock.getDelta() * speed;
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
